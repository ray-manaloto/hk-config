# ref: https://mise.jdx.dev/configuration.html
#:schema https://mise.jdx.dev/schema/mise.json

min_version = "2026.11.9"

[tools]
hk = "2.13.0"
pkl = "0.33.0"
jactionlint = "v2.6.0"
ghalint = "1.6.0"
pinact = "5.0.2"
zizmor = "1.32.0"
shellcheck = "0.11.0"
lychee = "0.24.2"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64"]

[task_config]
includes = ["tasks.toml"]
