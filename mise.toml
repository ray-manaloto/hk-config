# ref: https://mise.jdx.dev/configuration.html
#:schema https://mise.jdx.dev/schema/mise.json

min_version = "2026.11.12"

[tools]
hk = "2.13.0"
pkl = "0.33.1"
jactionlint = "v2.6.0"
ghalint = "1.6.0"
pinact = "5.0.2"
zizmor = "1.32.0"
shellcheck = "0.11.0"
lychee = "0.24.2"
"github:agent-sh/agnix" = "0.61.0"
# required for npm:semantic-release
node = "26.13.1"
"npm:semantic-release" = "26.0.1"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64"]

[task_config]
includes = ["tasks.toml"]
